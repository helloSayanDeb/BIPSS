[versions]
agp                      = "8.13.2"
kotlin                   = "2.1.0"
ksp                      = "2.1.0-1.0.29"
compose-bom              = "2025.04.01"
core-ktx                 = "1.15.0"
lifecycle                = "2.8.7"
activity-compose         = "1.10.1"
navigation-compose       = "2.8.9"
koin                     = "4.0.0"
datastore                = "1.1.2"
health-connect           = "1.1.0-alpha07"
room                     = "2.6.1"
kotlinx-coroutines       = "1.8.1"
kotlinx-serialization    = "1.7.3"
okhttp                   = "4.12.0"
mediapipe-tasks-genai    = "0.10.14"
work-runtime             = "2.9.1"
play-services-location   = "21.2.0"
play-services-auth       = "21.2.0"
accompanist-permissions  = "0.37.0"
firebase-bom             = "34.19.0"
junit                    = "4.13.2"

[libraries]
# AndroidX Core
androidx-core-ktx        = { group = "androidx.core",      name = "core-ktx",           version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose",   version.ref = "activity-compose" }

# Compose BOM + UI
androidx-compose-bom     = { group = "androidx.compose",   name = "compose-bom",        version.ref = "compose-bom" }
androidx-ui              = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics     = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-tooling      = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-material3       = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
navigation-compose       = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# Koin DI
koin-android             = { group = "io.insert-koin",     name = "koin-android",        version.ref = "koin" }
koin-androidx-compose    = { group = "io.insert-koin",     name = "koin-androidx-compose", version.ref = "koin" }
koin-androidx-workmanager = { group = "io.insert-koin",    name = "koin-androidx-workmanager", version.ref = "koin" }

# DataStore
datastore-preferences    = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Health Connect
health-connect-client    = { group = "androidx.health.connect", name = "connect-client", version.ref = "health-connect" }

# Room
room-runtime             = { group = "androidx.room",      name = "room-runtime",        version.ref = "room" }
room-ktx                 = { group = "androidx.room",      name = "room-ktx",            version.ref = "room" }
room-compiler            = { group = "androidx.room",      name = "room-compiler",       version.ref = "room" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

# Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# OkHttp
okhttp                   = { group = "com.squareup.okhttp3", name = "okhttp",            version.ref = "okhttp" }

# MediaPipe
mediapipe-tasks-genai    = { group = "com.google.mediapipe", name = "tasks-genai",       version.ref = "mediapipe-tasks-genai" }

# WorkManager
work-runtime-ktx         = { group = "androidx.work",      name = "work-runtime-ktx",   version.ref = "work-runtime" }

# Location
play-services-location   = { group = "com.google.android.gms", name = "play-services-location", version.ref = "play-services-location" }

# Google Sign-In (Drive appDataFolder backup)
play-services-auth       = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "play-services-auth" }

# Accompanist
accompanist-permissions  = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist-permissions" }

# Firebase (BOM only — individual libs declared as raw strings in build.gradle.kts)
firebase-bom             = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }

# Unit test
junit                    = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application      = { id = "com.android.application",            version.ref = "agp" }
kotlin-android           = { id = "org.jetbrains.kotlin.android",       version.ref = "kotlin" }
kotlin-compose           = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                      = { id = "com.google.devtools.ksp",            version.ref = "ksp" }
kotlin-serialization     = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services          = { id = "com.google.gms.google-services", version = "4.5.0" }
